[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genie-routing-reference"
version = "0.1.0"
description = "Customer-configured analytics routing for Databricks"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "Jinja2>=3.1,<4",
    "fastapi>=0.115,<1",
    "mcp>=1.10,<2",
    "databricks-sdk>=0.40,<1",
    "mlflow>=3.15,<4",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "jsonschema>=4,<5"]

[project.urls]
Repository = "https://github.com/omriaf/genie-routing-reference"

[tool.setuptools.packages.find]
include = ["setup", "setup.*", "app", "app.*"]

[tool.setuptools.package-data]
setup = ["templates/*.j2"]
app = ["app.yaml", "requirements.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
