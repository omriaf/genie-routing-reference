resources:
  apps:
    router_app:
      description: Customer-configured analytics router with referenced Genie spaces
        and functions
      name: acme-analytics-router
      permissions:
      - group_name: analytics-users
        level: CAN_USE
      resources:
      - name: classifier_endpoint
        serving_endpoint:
          name: databricks-claude-sonnet-4-5
          permission: CAN_QUERY
      - name: definitions_secret
        secret:
          key: github-token
          permission: READ
          scope: analytics-router
      - name: function_monthly_revenue
        uc_securable:
          permission: EXECUTE
          securable_full_name: acme_catalog.metrics.monthly_revenue
          securable_type: FUNCTION
      - name: function_resolution_time
        uc_securable:
          permission: EXECUTE
          securable_full_name: acme_catalog.metrics.resolution_time
          securable_type: FUNCTION
      - genie_space:
          name: sales
          permission: CAN_RUN
          space_id: 01abc000000000000000000000000001
        name: genie_sales
      - genie_space:
          name: support
          permission: CAN_RUN
          space_id: 01abc000000000000000000000000002
        name: genie_support
      - experiment:
          experiment_id: ${resources.experiments.router_experiment.id}
          permission: CAN_EDIT
        name: mlflow_experiment
      - name: sql_warehouse
        sql_warehouse:
          id: abc123
          permission: CAN_USE
      - name: trace_table
        uc_securable:
          permission: MODIFY
          securable_full_name: acme_catalog.analytics_router.routing_traces
          securable_type: TABLE
      source_code_path: app_source
  dashboards:
    router_dashboard:
      dataset_catalog: acme_catalog
      dataset_schema: analytics_router
      display_name: ${bundle.name}-${bundle.target}-performance
      embed_credentials: false
      file_path: ../dashboards/router_performance.lvdash.json
      permissions:
      - level: CAN_READ
        user_name: analyst@example.com
      warehouse_id: abc123
  experiments:
    router_experiment:
      name: /Shared/acme-analytics-router
  jobs:
    router_bootstrap:
      description: Rerunnable router DDL and explicit traversal/read grants
      max_concurrent_runs: 1
      name: ${bundle.name}-${bundle.target}-bootstrap
      tasks:
      - notebook_task:
          base_parameters:
            catalog: acme_catalog
            schema: analytics_router
          notebook_path: ../sql/bootstrap.sql
          source: WORKSPACE
          warehouse_id: abc123
        task_key: bootstrap
      - depends_on:
        - task_key: bootstrap
        notebook_task:
          base_parameters:
            catalog: acme_catalog
            principal: ${resources.apps.router_app.service_principal_client_id}
            schema: analytics_router
          notebook_path: ../sql/schema_access.sql
          source: WORKSPACE
          warehouse_id: abc123
        task_key: app_access_0
      - depends_on:
        - task_key: bootstrap
        notebook_task:
          base_parameters:
            catalog: acme_catalog
            principal: ${resources.apps.router_app.service_principal_client_id}
            schema: metrics
          notebook_path: ../sql/schema_access.sql
          source: WORKSPACE
          warehouse_id: abc123
        task_key: app_access_1
      - depends_on:
        - task_key: bootstrap
        notebook_task:
          base_parameters:
            catalog: acme_catalog
            principal: analyst@example.com
            schema: analytics_router
          notebook_path: ../sql/dashboard_access.sql
          source: WORKSPACE
          warehouse_id: abc123
        task_key: dashboard_access_0
sync:
  exclude:
  - ../demo/**
